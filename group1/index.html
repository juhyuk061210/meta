<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>1일차 — 메타광고 마스터클래스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #FBF3DC;
      --wine: #9E1C4A;
      --wine-deep: #7A1338;
      --magenta: #E73C7C;
      --magenta-soft: #F8B6D0;
      --ink: #1A1A1A;
      --ink-soft: #4A4A4A;
      --ink-mute: #8A8579;
      --bill-yellow: #F0CC60;
      --font-display: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-body: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif;
      --font-hand: 'Gaegu', cursive;
    }
    html, body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    body { max-width: 640px; margin: 0 auto; min-height: 100vh; }
    .site-header {
      background: var(--wine);
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 3px solid var(--ink);
    }
    .site-header .logo {
      font-family: var(--font-display);
      font-size: 14px;
      font-weight: 800;
      color: var(--paper);
      letter-spacing: 0.08em;
    }
    .tab-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      background: var(--paper);
      border-bottom: 3px solid var(--ink);
    }
    .tab-btn {
      flex: 1;
      min-height: 58px;
      padding: 10px 3px 9px;
      background: none;
      border: none;
      border-right: 1px solid var(--ink);
      color: var(--ink-mute);
      font-family: var(--font-body);
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
    }
    .live-tab { text-decoration: none; color: var(--wine); }
    .tab-btn:last-child { border-right: none; }
    .tab-btn.active {
      background: var(--wine);
      color: var(--paper);
    }
    .day-num {
      font-family: var(--font-display);
      font-size: 19px;
      font-weight: 800;
      line-height: 1;
    }
    .tab-note {
      color: var(--magenta);
      font-size: 8px;
      line-height: 1.05;
    }
    .tab-btn.active .tab-note { color: #ffc6d9; }
    .community-label { font-size: 8px; line-height: 1.1; word-break: keep-all; }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; animation: fadein .18s ease; }
    @keyframes fadein {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .hook, .day-hook {
      padding: 36px 24px 28px;
      border-bottom: 2px solid var(--ink);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 14px;
      margin-bottom: 18px;
      background: var(--wine);
      color: var(--paper);
      border: 1.5px solid var(--ink);
      border-radius: 9999px;
      box-shadow: 2px 2px 0 var(--ink);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .hook-hand {
      display: block;
      margin-bottom: 12px;
      color: var(--wine);
      font-family: var(--font-hand);
      font-size: 20px;
    }
    .title {
      margin-bottom: 12px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(32px, 8vw, 52px);
      line-height: 1.1;
      letter-spacing: 0;
    }
    .title .pink {
      color: var(--magenta);
      background: linear-gradient(transparent 60%, var(--magenta-soft) 60%);
      padding: 0 4px;
    }
    .sub {
      color: var(--ink-soft);
      font-size: 16px;
      line-height: 1.75;
    }
    .video-card, .locked-card {
      width: 100%;
      background: var(--ink);
      border-bottom: 3px solid var(--ink);
      color: var(--paper);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 42px 24px;
      gap: 18px;
    }
    .card-label {
      color: rgba(255,255,255,.5);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .card-title {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(21px, 6vw, 34px);
      line-height: 1.25;
      max-width: 520px;
      text-align: center;
      word-break: keep-all;
      overflow-wrap: break-word;
    }
    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      padding: 14px 26px;
      background: var(--wine);
      color: var(--paper);
      border: 2px solid var(--paper);
      border-radius: 4px;
      box-shadow: 4px 4px 0 var(--wine-deep);
      font-size: 17px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    .ghost-btn {
      background: transparent;
      color: var(--paper);
      border-color: rgba(255,255,255,.65);
      box-shadow: none;
      font-size: 14px;
    }
    .lock-page {
      min-height: 640px;
      padding: 58px 24px 78px;
      text-align: center;
    }
    .star {
      margin: 0 auto 20px;
      color: var(--bill-yellow);
      -webkit-text-stroke: 1.5px var(--ink);
      font-size: 44px;
      line-height: 1;
    }
    .locked-title {
      margin: 20px 0 18px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: clamp(31px, 8vw, 48px);
      line-height: 1.15;
    }
    .locked-copy {
      margin-bottom: 28px;
      color: var(--ink-soft);
      font-size: 15px;
      line-height: 1.85;
    }
    .locked-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .locked-actions .action-btn {
      border-color: var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
    }
    .release-card {
      margin: 28px 24px 40px;
      padding: 32px 20px;
      border: 2px solid var(--ink);
      border-radius: 12px;
      background: var(--wine);
      color: var(--paper);
      box-shadow: 6px 6px 0 var(--ink);
      text-align: center;
    }
    .release-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      margin-bottom: 16px;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background: var(--bill-yellow);
      color: var(--ink);
    }
    .release-title { font-size: clamp(22px, 6vw, 34px); font-weight: 800; line-height: 1.4; word-break: keep-all; }
    .release-copy { margin-top: 10px; font-size: 14px; line-height: 1.7; }
  </style>
</head>
<body>
  <header class="site-header">
    <span class="logo">메타광고 마스터클래스</span>
  </header>

  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="0" onclick="goTab(0)">
      <span class="day-num">1</span><span>일차</span>
    </button>
    <button class="tab-btn" data-tab="1" onclick="goTab(1)">
      <span class="day-num">2</span><span>일차</span>
    </button>
    <a class="tab-btn live-tab" href="https://open.kakao.com/o/gXzGHjLi" target="_blank" rel="noopener"><span>라이브 강의</span><span>참석하기!</span></a>
  </nav>

  <div class="tab-panel active" id="panel-0">
    <section class="hook">
      <div class="badge">무료 공개 · 1일차</div>
      <span class="hook-hand">지금 바로 확인하세요</span>
      <h1 class="title">일 매출 500을 만드는<br><span class="pink">메타광고 사이클</span></h1>
      <p class="sub">광고비 낭비 없이, 검증된 사이클만으로<br>매출을 직접 올리는 방법을 공개합니다.</p>
    </section>
    <div class="video-card">
      <span class="card-label">1일차 강의 영상</span>
      <div class="card-title">일 매출 500을 만드는 메타광고 사이클</div>
      <a class="action-btn ghost-btn" href="https://youtu.be/GDcX8oZLNLc" target="_blank" rel="noopener">유튜브에서 바로 보기</a>
    </div>
  </div>

  <div class="tab-panel" id="panel-1">
    <section class="hook">
      <div class="badge">2일차 강의</div>
      <span class="hook-hand">실전 사례를 공개합니다</span>
      <h1 class="title">실제 판매한 제품,<br><span class="pink">소재 공유</span></h1>
    </section>
    <div class="release-card">
      <span class="release-icon" aria-hidden="true"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
      <p class="release-title">24시간내 공개 예정</p>
      <p class="release-copy">실제 판매한 제품과 광고 소재를<br>곧 이곳에서 확인하세요.</p>
    </div>
  </div>
  <script>
    function goTab(n) {
      document.querySelectorAll('.tab-panel').forEach(function(panel) {
        panel.classList.remove('active');
      });
      document.querySelectorAll('.tab-btn').forEach(function(button) {
        button.classList.remove('active');
      });
      document.getElementById('panel-' + n).classList.add('active');
      document.querySelector('[data-tab="' + n + '"]').classList.add('active');
      window.scrollTo({ top: 0 });
    }
  </script>
</body>
</html>
